<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TraceLab{% endblock %}</title>
  <style>
    :root { --bg:#fff; --fg:#1d2330; --muted:#5b6475; --line:#dde1e8; --soft:#f4f6f9;
            --pass:#1b7a3d; --fail:#b42318; --warn:#9a6700; --skip:#5b6475; --link:#1f5fbf; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171c; --fg:#e4e7ec; --muted:#9aa3b2; --line:#2c323c; --soft:#1c2027;
              --pass:#4cc27a; --fail:#ff7b6e; --warn:#e3b341; --skip:#9aa3b2; --link:#7fb0ff; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg);
           font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
    header strong { font-size:16px; }
    main { padding:16px; max-width:1300px; margin:0 auto; }
    a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
    h1 { font-size:20px; margin:4px 0 12px; } h2 { font-size:16px; margin:22px 0 8px; }
    table { border-collapse:collapse; width:100%; }
    th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.03em; }
    .scroll { overflow-x:auto; }
    code, pre { font-family: ui-monospace, Consolas, monospace; font-size:12.5px; }
    pre { background:var(--soft); padding:10px; border-radius:6px; overflow-x:auto; margin:6px 0; white-space:pre-wrap; word-break:break-word; }
    .muted { color:var(--muted); }
    .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:600; border:1px solid currentColor; }
    .passed, .ok { color:var(--pass); } .failed, .error { color:var(--fail); }
    .skipped, .running { color:var(--skip); } .cancelled, .aborted, .warn { color:var(--warn); }
    .cards { display:flex; gap:10px; flex-wrap:wrap; margin:8px 0 4px; }
    .card { border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:110px; }
    .card .n { font-size:20px; font-weight:700; } .card .l { color:var(--muted); font-size:12px; }
    .fault { color:var(--warn); font-weight:600; }
    .notice { border-left:3px solid var(--warn); background:var(--soft); padding:8px 12px; margin:10px 0; }
    details > summary { cursor:pointer; color:var(--muted); }
    .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
    form.inline { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    select, button { font:inherit; padding:4px 8px; max-width:100%; }
  </style>
</head>
<body>
<header>
  <strong>TraceLab</strong>
  <a href="/">Runs</a>
  <a href="/compare">Compare</a>
  <a href="/docs">API docs</a>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
